[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supportiq"
version = "0.1.0"
description = "Banking customer support intent classification and analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<3.0",
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.4,<2.0",
  "joblib>=1.3,<2.0",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "streamlit>=1.32,<2.0",
  "openpyxl>=3.1,<4.0",
  "requests>=2.31,<3.0",
]

[project.optional-dependencies]
training = ["datasets>=2.18,<4.0"]
transformers = [
  "transformers>=4.46,<5.0",
  "datasets>=2.18,<4.0",
  "torch>=2.2",
]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
