services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - "./artifacts:/app/artifacts"
      - "./data:/app/data"
      - "./reports:/app/reports"
    environment:
      SUPPORTIQ_DATABASE_PATH: /app/data/supportiq.db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dashboard:
    build: .
    command: streamlit run app/streamlit_app.py --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - "./reports:/app/reports"
      - "./data:/app/data"
    depends_on:
      api:
        condition: service_healthy
    environment:
      SUPPORTIQ_API_URL: http://api:8000
