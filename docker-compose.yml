services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes: ["./artifacts:/app/artifacts", "./data:/app/data"]
  dashboard:
    build: .
    command: streamlit run app/streamlit_app.py --server.address 0.0.0.0
    ports: ["8501:8501"]
    depends_on: [api]
    environment:
      SUPPORTIQ_API_URL: http://api:8000
