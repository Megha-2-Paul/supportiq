name: tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run lint checks
        run: ruff check .
      - name: Compile Python modules
        run: python -m compileall -q src api app ml tests
      - name: Run test suite
        run: pytest

  docker-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start API and dashboard
        run: docker compose up --build --detach
      - name: Verify API and dashboard health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:8000/health
          dashboard_healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8501/_stcore/health -o /tmp/dashboard-health; then
              dashboard_healthy=true
              break
            fi
            sleep 2
          done
          test "$dashboard_healthy" = true
          cat /tmp/dashboard-health
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans

  baseline-training:
    name: Train and smoke test Banking77 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install training and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,training]"
      - name: Train baseline on official Banking77 splits
        run: python ml/train_baseline.py
      - name: Verify metrics, artifact, and real inference
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from supportiq.service import SupportIQService

          artifact = Path("artifacts/intent_model.joblib")
          report = json.loads(Path("reports/baseline_metrics.json").read_text())
          assert artifact.is_file()
          for metric in ("accuracy", "macro_f1", "weighted_f1"):
              assert 0.0 <= report[metric] <= 1.0
          assert report["dataset"] == "PolyAI/banking77"
          result = SupportIQService().classify(
              "My cash withdrawal was debited but no cash came out."
          )
          assert result["intent"]
          assert 0.0 <= result["confidence"] <= 1.0
          assert result["department"]
          print({
              "accuracy": report["accuracy"],
              "macro_f1": report["macro_f1"],
              "weighted_f1": report["weighted_f1"],
              "smoke_test_intent": result["intent"],
          })
          PY
